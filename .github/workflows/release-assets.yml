name: Refresh development draft assets

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable Git tag and draft release, for example v1.2.0
        required: true
        default: v1.2.0

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release source and metadata
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          head_commit=$(git rev-parse HEAD)
          tag_commit=$(git rev-list -n 1 "$RELEASE_TAG")
          test "$head_commit" = "$tag_commit"
          echo "commit=$head_commit" >> "$GITHUB_OUTPUT"
          test "$(gh release view "$RELEASE_TAG" --json isDraft -q '.isDraft')" = "true"
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          test "$RELEASE_TAG" = "v$version"
          plutil -lint Resources/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' Resources/Info.plist)" = "false"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' Resources/Info.plist)" = "15.0"

      - name: Compile local validation target
        run: swift build -c release --product DailyMacValidation

      - name: Run deterministic validation
        run: .build/release/DailyMacValidation --skip-live

      - name: Package and verify assets
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/package.sh
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          codesign --verify --deep --strict --verbose=2 "outputs/MY MACHINE.app"
          unzip -t "outputs/MY-MACHINE-$version.zip"
          unzip -t "outputs/MY-MACHINE-Source-$version.zip"
          (cd outputs && shasum -a 256 -c "SHA256SUMS-$version.txt")

      - name: Audit source archive privacy boundary
        shell: bash
        run: |
          set -euo pipefail
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          listing=$(unzip -Z1 "outputs/MY-MACHINE-Source-$version.zip")
          if printf '%s\n' "$listing" | grep -E '(^|/)(\.git|\.build|outputs|work)(/|$)|\.(sqlite|sqlite-wal|sqlite-shm|db)$'; then
            echo "Private or generated content entered the source archive" >&2
            exit 1
          fi
          printf '%s\n' "$listing" | grep -q 'MY-MACHINE-Source/PRIVACY.md'
          printf '%s\n' "$listing" | grep -q 'MY-MACHINE-Source/SECURITY.md'
          printf '%s\n' "$listing" | grep -q 'MY-MACHINE-Source/Sources/'

      - name: Store inspected development artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: development-draft-${{ github.run_id }}
          path: |
            outputs/MY-MACHINE-*.zip
            outputs/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 1

  upload-draft:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      # No repository checkout or project code executes with the write token.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: development-draft-${{ github.run_id }}
          path: artifacts
      - name: Replace development draft assets only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          resolved=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq '.sha')
          test "$resolved" = "$SOURCE_COMMIT"
          test "$(gh release view "$RELEASE_TAG" --json isDraft -q '.isDraft')" = "true"
          version=${RELEASE_TAG#v}
          cd artifacts
          shasum -a 256 -c "SHA256SUMS-$version.txt"
          gh release upload "$RELEASE_TAG" \
            "MY-MACHINE-$version.zip" \
            "MY-MACHINE-Source-$version.zip" \
            "SHA256SUMS-$version.txt" \
            --clobber
